<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Dilshad</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#ffffff;--alt:#f5f5f7;--ink:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,0.12);--gold:#6d2334;--font:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);letter-spacing:-0.011em;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
  header{height:52px;border-bottom:1px solid var(--line);}
  header .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(20px,5vw,40px);height:52px;display:flex;align-items:center;}
  .logo{font-family:"Outfit",var(--font);font-weight:700;font-size:1.5rem;letter-spacing:-0.01em;color:var(--ink);text-decoration:none;}
  main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:80px clamp(20px,5vw,40px);}
  .eyebrow{font-size:1.15rem;font-weight:600;color:var(--gold);margin-bottom:14px;}
  h1{font-weight:700;font-size:clamp(3rem,11vw,6.5rem);line-height:1;letter-spacing:-0.05em;margin-bottom:22px;}
  p.msg{color:var(--muted);font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.4;max-width:560px;margin:0 auto 34px;}
  a.btn{display:inline-block;padding:12px 26px;border-radius:980px;background:var(--gold);color:#fff;text-decoration:none;font-size:1.0625rem;font-weight:500;}
  a.btn:hover{background:#8a2d44;}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="/">Dilshad</a></div></header>
<main>
  <div>
    <p class="eyebrow">Error 404</p>
    <h1>Page not found.</h1>
    <p class="msg">The page you're looking for doesn't exist or has moved. Head back to the homepage, or read the full profile of Dilshad, cryptocurrency trader and entrepreneur from Kerala, India.</p>
    <a class="btn" href="/">Back to homepage</a>
  </div>
</main>
</body>
</html>
