<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Dilshad</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#f6f1e6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&family=Outfit:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f1e6;--ink:#1a1613;--muted:#6b6152;--line:rgba(26,22,19,0.14);--gold:#6d2334;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:"Manrope",-apple-system,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;}
  header{border-bottom:1px solid var(--line);}
  header .wrap{max-width:1100px;margin:0 auto;padding:0 24px;height:76px;display:flex;align-items:center;}
  .logo{font-family:"Outfit",sans-serif;font-weight:700;font-size:1.6rem;letter-spacing:-0.01em;color:var(--ink);text-decoration:none;}
  main{flex:1;display:flex;align-items:center;}
  main .wrap{max-width:1100px;margin:0 auto;padding:80px 24px;}
  .label{font-size:0.76rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--muted);margin-bottom:22px;}
  h1{font-weight:800;font-size:clamp(3rem,9vw,6rem);line-height:0.95;margin-bottom:22px;}
  p{color:var(--muted);font-size:1.1rem;font-weight:300;max-width:520px;margin-bottom:32px;}
  a.btn{display:inline-block;padding:16px 30px;background:var(--gold);color:var(--bg);text-decoration:none;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.14em;font-weight:600;}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="/">Dilshad</a></div></header>
<main>
  <div class="wrap">
    <div class="label">Error 404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved. You can head back to the homepage or read the full profile of Dilshad, cryptocurrency trader and entrepreneur from Kerala, India.</p>
    <a class="btn" href="/">Back to homepage</a>
  </div>
</main>
</body>
</html>
